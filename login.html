<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login & Register - Adaptive AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
      body { background: #f4f7fe; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .auth-card { width: 100%; max-width: 420px; border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); }
    </style>
  </head>
  <body>
    <div class="card auth-card p-4 bg-white">
      <div class="text-center mb-4">
        <h3 class="text-primary fw-bold"><i class="fa-solid fa-brain"></i> Adaptive AI</h3>
        <p class="text-muted small">Personalized Learning Platform</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <h5 class="fw-bold mb-3">Sign In</h5>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" required placeholder="name@example.com" />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••" />
        </div>
        <!-- Removed the <a> tag around the button so the form can actually submit -->
        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">Login</button>
        <p class="text-center mt-3 small">Don't have an account? <a href="register.html" id="showRegister">Register</a></p>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="d-none">
        <h5 class="fw-bold mb-3">Create Account</h5>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="regName" class="form-control" required placeholder="John Doe" />
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" id="regEmail" class="form-control" required placeholder="name@example.com" />
        </div>
        <div class="mb-3">
          <label class="form-label">Create Password</label>
          <input type="password" id="regPassword" class="form-control" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-success w-100 rounded-pill py-2">Register</button>
        <p class="text-center mt-3 small">Already have an account? <a href="#" id="showLogin">Login</a></p>
      </form>
    </div>

   <script>
  const loginForm = document.getElementById("loginForm");

  loginForm.onsubmit = (e) => {
    e.preventDefault(); 
    
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    // 1. Fetch our mock database
    let usersDB = JSON.parse(localStorage.getItem("usersDB")) || [];

    // 2. Look for a user with the matching email
    const foundUser = usersDB.find(user => user.email === email);

    // 3. Handle unregistered users
    if (!foundUser) {
      alert("Account not found. Please register first!");
      return;
    }

    // 4. Handle incorrect passwords
    if (foundUser.password !== password) {
      alert("Incorrect password. Please try again.");
      return;
    }

    // 5. Success! Log them in
    localStorage.setItem("userToken", "active_session_token");
    localStorage.setItem("userEmail", email);

    window.location.href = "index.html";
  };
</script>
  </body>
</html>
