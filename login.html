<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - Adaptive AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7fe; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { width: 100%; max-width: 420px; border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<div class="card auth-card p-4 bg-white">
    <div class="text-center mb-4">
        <h3 class="text-primary fw-bold"><i class="fa-solid fa-brain"></i> Adaptive AI</h3>
        <p class="text-muted small">Personalized Learning Platform</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
        <h5 class="fw-bold mb-3">Sign In</h5>
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" id="loginEmail" class="form-control" required placeholder="name@example.com">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">Login</button>
        <p class="text-center mt-3 small">Don't have an account? <a href="#" id="showRegister">Register</a></p>
    </form>

    <!-- Register Form (Initially Hidden) -->
    <form id="registerForm" class="d-none">
        <h5 class="fw-bold mb-3">Create Account</h5>
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" id="regName" class="form-control" required placeholder="John Doe">
        </div>
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" id="regEmail" class="form-control" required placeholder="name@example.com">
        </div>
        <div class="mb-3">
            <label class="form-label">Create Password</label>
            <input type="password" id="regPassword" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-success w-100 rounded-pill py-2">Register</button>
        <p class="text-center mt-3 small">Already have an account? <a href="index.html" id="showLogin">Login</a></p>
    </form>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    document.getElementById('showRegister').onclick = () => { loginForm.classList.add('d-none'); registerForm.classList.remove('d-none'); };
    document.getElementById('showLogin').onclick = () => { registerForm.classList.add('d-none'); loginForm.classList.remove('d-none'); };

    // Handle Login
    loginForm.onsubmit = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: loginEmail.value, password: loginPassword.value })
        });
        const data = await res.json();
        if (data.success) window.location.href = data.redirect;
        else alert(data.error);
    };

    // Handle Registration
    registerForm.onsubmit = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ full_name: regName.value, email: regEmail.value, password: regPassword.value })
        });
        const data = await res.json();
        if (data.success) {
            alert('Registration complete! Please setup your profile.');
            window.location.href = '/profile-setup.html';
        } else alert(data.error);
    };
</script>
</body>
</html>
