<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - Adaptive AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Adaptive AI</a>
        
        <div class="d-flex align-items-center">
          <!-- Text to show when logged in -->
          <span id="welcomeText" class="text-white me-3 d-none"></span>
          
          <!-- Login Button (Visible when NOT logged in) -->
          <a href="login.html" id="loginBtn" class="btn btn-light">Log In</a>
          
          <!-- Logout Button (Visible when LOGGED IN) -->
          <button id="logoutBtn" class="btn btn-outline-light d-none">Log Out</button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5 text-center">
      <h1>Welcome to the Platform</h1>
      <p class="lead mt-3" id="mainContent">
        Please log in to access your personalized learning dashboard.
      </p>
    </div>

    <!-- Script to handle Authentication State -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 1. Check if user is logged in by looking for the token
        const token = localStorage.getItem("userToken");
        const userEmail = localStorage.getItem("userEmail");

        // Grab UI elements
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const welcomeText = document.getElementById("welcomeText");
        const mainContent = document.getElementById("mainContent");

        if (token) {
          // USER IS LOGGED IN: Update the interface
          loginBtn.classList.add("d-none");          // Hide Login
          logoutBtn.classList.remove("d-none");      // Show Logout
          
          welcomeText.classList.remove("d-none");    // Show Welcome Text
          welcomeText.innerText = `Hello, ${userEmail}`;
          
          mainContent.innerText = "You are successfully logged in! Here is your private learning dashboard.";
        } else {
          // USER IS NOT LOGGED IN: Keep default UI
          // (Login button stays visible, logout button stays hidden)
        }

        // 2. Handle Logout Action
        logoutBtn.addEventListener("click", () => {
          // Clear memory
          localStorage.removeItem("userToken");
          localStorage.removeItem("userEmail");
          
          // Refresh the page to reset the UI
          window.location.reload(); 
        });
      });
    </script>
  </body>
</html>
