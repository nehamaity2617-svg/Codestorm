<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Adaptive AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
      body { background: #f4f7fe; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .auth-card { width: 100%; max-width: 420px; border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); }
    </style>
  </head>
  <body>
    <div class="card auth-card p-4 bg-white">
      <div class="text-center mb-4">
        <h3 class="text-primary fw-bold"><i class="fa-solid fa-brain"></i> Adaptive AI</h3>
        <p class="text-muted small">Create your account</p>
      </div>

      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="regName" class="form-control" required placeholder="John Doe" />
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" id="regEmail" class="form-control" required placeholder="name@example.com" />
        </div>
        <div class="mb-3">
          <label class="form-label">Create Password</label>
          <input type="password" id="regPassword" class="form-control" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-success w-100 rounded-pill py-2">Register</button>
        <p class="text-center mt-3 small">
          Already have an account? <a href="login.html">Log In</a>
        </p>
      </form>
    </div>

    <script>
  const registerForm = document.getElementById("registerForm");

  registerForm.onsubmit = (e) => {
    e.preventDefault(); 
    
    const name = document.getElementById("regName").value;
    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;

    // 1. Fetch our mock database (or create an empty one if it doesn't exist yet)
    let usersDB = JSON.parse(localStorage.getItem("usersDB")) || [];

    // 2. Check if the email is already registered
    const userExists = usersDB.find(user => user.email === email);
    if (userExists) {
      alert("An account with this email already exists. Please log in.");
      return; // Stop the function here
    }

    // 3. Add the new user to the database
    usersDB.push({ name: name, email: email, password: password });
    localStorage.setItem("usersDB", JSON.stringify(usersDB));

    // 4. Log the user in immediately
    localStorage.setItem("userToken", "active_session_token");
    localStorage.setItem("userEmail", email);

    alert("Account created! Taking you to the dashboard.");
    window.location.href = "index.html";
  };
</script>
  </body>
</html>
